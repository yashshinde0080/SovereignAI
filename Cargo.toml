# Cargo.toml
[package]
name = "sovereign-ai"
version = "0.1.0"
edition = "2021"
authors = ["SovereignAI Team"]
description = "Portable, offline-first LLM runtime with dual execution engines"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
memmap2 = "0.9"
reqwest = { version = "0.11", features = ["stream", "json"], optional = true }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
base64 = "0.21"
hex = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures = "0.3"
crossbeam = "0.8"
parking_lot = "0.12"
sysinfo = "0.30"
num_cpus = "1.16"
tempfile = "3.9"
walkdir = "2.4"
tiktoken-rs = "0.5"

[features]
default = ["online"]
online = ["reqwest"]
enterprise = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3