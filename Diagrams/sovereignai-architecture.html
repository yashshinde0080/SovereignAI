<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SovereignAI Edge — Platform Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxanium:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4f9;
      --color-paper-2: #e9eaf2;
      --color-ink:     #191a2b;
      --color-muted:   #4a5578;
      --color-soft:    #5a6580;
      --color-accent:  #3C3489;
      --color-link:    #12704f;
      --font-sans:     'Oxanium', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Source Code Pro', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SovereignAI Edge</p>
    <h1>One gateway, three inference engines, zero cloud dependency</h1>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#12704f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f4f9"/>

        <text x="130" y="73" fill="#5a6580" font-size="7" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL HOST · 127.0.0.1</text>

        <text x="924" y="113" fill="#5a6580" font-size="7" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NET</text>

        <line x1="168" y1="228" x2="304" y2="228" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
