<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Mode Selection</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxanium:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4f9;
      --color-paper-2: #e9eaf2;
      --color-ink:     #191a2b;
      --color-muted:   #4a5578;
      --color-soft:    #5a6580;
      --color-rule:    rgba(25,26,43,0.12);
      --color-rule-solid: #c3c7d9;
      --color-accent:  #3C3489;
      --color-accent-tint: rgba(60,52,137,0.08);
      --color-link:    #12704f;
      --font-sans:     'Oxanium', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Source Code Pro', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · SovereignAI Edge</p>
    <h1>Auto Mode Selection</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="11-hardware-memory-title 11-hardware-memory-desc">
        <title id="11-hardware-memory-title">Auto Mode Selection</title>
        <desc id="11-hardware-memory-desc">Flowchart of SovereignAI's auto engine-mode decision, where llmfit scoring or a residency-threshold fallback selects FullRAM, LayerStream, or reports insufficient memory.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5578"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3C3489"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#12704f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f4f9"/>

        <!-- ═══ Arrows (drawn before boxes) ═══ -->
        <!-- start → input -->
        <line x1="480" y1="64" x2="480" y2="100" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- input → llmfit (spine, straight) -->
        <line x1="480" y1="156" x2="480" y2="196" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- input → fallback threshold (right branch, elbow) -->
        <path d="M 560 128 H 812 V 276" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- llmfit → diamond -->
        <line x1="480" y1="244" x2="480" y2="280" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- diamond YES → FullRAM (accent happy path, elbow) -->
        <path d="M 564 304 H 616 V 148 H 664" fill="none" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- diamond fit>0.6 → LayerStream (elbow) -->
        <path d="M 524 324 H 640 V 288 H 664" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- diamond NO → insufficient (straight down) -->
        <line x1="480" y1="352" x2="480" y2="396" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- fallback → FullRAM (left channel elbow, up into bottom edge) -->
        <path d="M 728 300 H 200 H 192 V 172 H 616 V 176" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- fallback → LayerStream (elbow) -->
        <path d="M 728 320 H 232 H 240 V 260 H 656 V 288" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- fallback → insufficient (elbow, under diamond) -->
        <path d="M 728 336 H 248 H 256 V 376 H 464 V 396" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- diamond bottom-left edge → fallback (merge) -->
        <path d="M 436 330 V 336 H 728" fill="none" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ═══ Arrow labels (masked) ═══ -->
        <rect x="452" y="160" width="20" height="12" rx="2" fill="#f4f4f9"/>
        <text x="462" y="169" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="712" y="160" width="112" height="14" rx="2" fill="#f4f4f9"/>
        <text x="768" y="170" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO · LLMFIT N/A</text>

        <rect x="570" y="280" width="76" height="14" rx="2" fill="#f4f4f9"/>
        <text x="608" y="290" fill="#3C3489" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIT &gt; 0.85</text>

        <rect x="548" y="246" width="72" height="14" rx="2" fill="#f4f4f9"/>
        <text x="584" y="256" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIT &gt; 0.6</text>

        <rect x="488" y="370" width="36" height="14" rx="2" fill="#f4f4f9"/>
        <text x="506" y="380" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ELSE</text>

        <rect x="272" y="336" width="76" height="14" rx="2" fill="#f4f4f9"/>
        <text x="310" y="346" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESIDENCY</text>

        <!-- ═══ Nodes ═══ -->
        <!-- Start (oval) -->
        <ellipse cx="480" cy="40" rx="68" ry="24" fill="rgba(74,85,120,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="480" y="44" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">mode = auto</text>

        <!-- HardwareDetector input -->
        <rect x="344" y="100" width="272" height="56" rx="6" fill="#f4f4f9"/>
        <rect x="344" y="100" width="272" height="56" rx="6" fill="rgba(74,85,120,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="352" y="106" width="64" height="12" rx="2" fill="transparent" stroke="rgba(74,85,120,0.40)" stroke-width="0.8"/>
        <text x="384" y="115" fill="rgba(74,85,120,0.80)" font-size="7" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROFILE</text>
        <text x="480" y="132" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">HardwareDetector + model size</text>
        <text x="480" y="147" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">hardware_detector.py · size_bytes</text>

        <!-- score_model_fit -->
        <rect x="344" y="196" width="272" height="48" rx="6" fill="#f4f4f9"/>
        <rect x="344" y="196" width="272" height="48" rx="6" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <rect x="352" y="202" width="48" height="12" rx="2" fill="transparent" stroke="rgba(25,26,43,0.40)" stroke-width="0.8"/>
        <text x="376" y="211" fill="rgba(25,26,43,0.80)" font-size="7" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLMFIT</text>
        <text x="480" y="222" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">score_model_fit</text>
        <text x="480" y="236" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">probe_hardware · fit_score</text>

        <!-- Decision diamond (focal accent, element 1) -->
        <polygon points="480,280 648,328 480,376 312,328" fill="rgba(60,52,137,0.05)"/>
        <polygon points="480,280 648,328 480,376 312,328" fill="rgba(60,52,137,0.08)" stroke="#3C3489" stroke-width="1.2"/>
        <text x="480" y="322" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Fit gate</text>
        <text x="480" y="338" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">score &amp; RAM 70%</text>

        <!-- Threshold fallback -->
        <rect x="728" y="276" width="168" height="72" rx="6" fill="#f4f4f9"/>
        <rect x="728" y="276" width="168" height="72" rx="6" fill="rgba(25,26,43,0.03)" stroke="rgba(25,26,43,0.30)" stroke-width="1"/>
        <rect x="736" y="282" width="72" height="12" rx="2" fill="transparent" stroke="rgba(25,26,43,0.30)" stroke-width="0.8"/>
        <text x="772" y="291" fill="rgba(25,26,43,0.60)" font-size="7" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>
        <text x="812" y="308" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Threshold fallback</text>
        <text x="812" y="322" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">GGUF x4.0 RAM</text>
        <text x="812" y="334" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">CUDA x1.15 headroom</text>

        <!-- Terminal: FullRAM -->
        <ellipse cx="744" cy="152" rx="80" ry="24" fill="#f4f4f9"/>
        <ellipse cx="744" cy="152" rx="80" ry="24" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <text x="744" y="149" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">FullRAM</text>
        <text x="744" y="162" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">transformers</text>

        <!-- Terminal: LayerStream -->
        <ellipse cx="744" cy="288" rx="80" ry="24" fill="#f4f4f9"/>
        <ellipse cx="744" cy="288" rx="80" ry="24" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <text x="744" y="285" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">LayerStream</text>
        <text x="744" y="298" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">layer swap</text>

        <!-- Terminal: Insufficient (muted / optional) -->
        <ellipse cx="480" cy="420" rx="84" ry="24" fill="#f4f4f9"/>
        <ellipse cx="480" cy="420" rx="84" ry="24" fill="rgba(25,26,43,0.02)" stroke="rgba(25,26,43,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="480" y="417" fill="#4a5578" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Insufficient</text>
        <text x="480" y="430" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">RuntimeError</text>

        <!-- Annotation callout (italic serif) -->
        <text x="64" y="480" fill="#191a2b" font-size="11" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Note: non-generative models suggested for layerstream are forced to fullram.</text>

        <!-- ═══ Legend strip ═══ -->
        <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(25,26,43,0.10)" stroke-width="0.8"/>
        <text x="30" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="108" y="550" width="20" height="12" rx="3" fill="rgba(60,52,137,0.08)" stroke="#3C3489" stroke-width="1"/>
        <text x="134" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">FOCAL DECISION</text>

        <rect x="258" y="550" width="20" height="12" rx="3" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <text x="284" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">STEP</text>

        <ellipse cx="368" cy="556" rx="11" ry="6" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <text x="384" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">OUTCOME</text>

        <rect x="478" y="550" width="20" height="12" rx="3" fill="rgba(74,85,120,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="504" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">PROFILE INPUT</text>

        <rect x="638" y="550" width="20" height="12" rx="3" fill="rgba(25,26,43,0.03)" stroke="rgba(25,26,43,0.30)" stroke-width="1"/>
        <text x="664" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">FALLBACK</text>

        <line x1="768" y1="556" x2="792" y2="556" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="800" y="560" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.06em">HAPPY PATH</text>

      </svg>
    </div>
  </div>
</body>
</html>
