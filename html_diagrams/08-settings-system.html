<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings System — SovereignAI Edge</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxanium:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4f9;
      --color-ink:     #191a2b;
      --color-muted:   #4a5578;
      --color-accent:  #3C3489;
      --font-sans:  'Oxanium', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Source Code Pro', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer Stack · SovereignAI Edge</p>
    <h1>Settings System</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-settings-system-title 08-settings-system-desc">
        <title id="08-settings-system-title">Settings stack from API router down to SQLite, feeding prompt and auth</title>
        <desc id="08-settings-system-desc">Requests flow down through the settings API router, the SettingsService, the section schemas, and the SettingsDatabase into the sovereign_settings SQLite file; the service layer feeds the assembled system prompt to chat and the security section to the auth middleware.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5578"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3C3489"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f4f9"/>

        <!-- direction margin -->
        <line x1="92" y1="130" x2="92" y2="418" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="84" y="120" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">HTTP ↓</text>
        <text x="84" y="432" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">↑ VALUES</text>

        <!-- connectors (bands drawn after) -->
        <line x1="700" y1="209" x2="740" y2="209" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="700" y1="275" x2="740" y2="275" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- band L4 -->
        <rect x="120" y="110" width="580" height="66" rx="0" fill="#ffffff" stroke="#4a5578" stroke-width="1"/>
        <text x="140" y="136" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.12em">L4</text>
        <text x="176" y="140" fill="#191a2b" font-size="15" font-weight="600" font-family="'Oxanium', system-ui, sans-serif">API Router</text>
        <text x="676" y="140" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="end">GET/PUT /v1/settings/{section} · /agents</text>

        <!-- band L3 focal -->
        <rect x="120" y="176" width="580" height="66" rx="0" fill="rgba(60,52,137,0.06)" stroke="#3C3489" stroke-width="1.4"/>
        <text x="140" y="202" fill="#3C3489" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.12em">L3</text>
        <text x="176" y="206" fill="#191a2b" font-size="15" font-weight="600" font-family="'Oxanium', system-ui, sans-serif">SettingsService</text>
        <text x="676" y="206" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="end">get_system_prompt · update · verify_password</text>

        <!-- band L2 -->
        <rect x="120" y="242" width="580" height="66" rx="0" fill="#ffffff" stroke="#4a5578" stroke-width="1"/>
        <text x="140" y="268" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.12em">L2</text>
        <text x="176" y="272" fill="#191a2b" font-size="15" font-weight="600" font-family="'Oxanium', system-ui, sans-serif">Section Schemas</text>
        <text x="676" y="272" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="end">general · personalization · security · parental</text>

        <!-- band L1 -->
        <rect x="120" y="308" width="580" height="66" rx="0" fill="#ffffff" stroke="#4a5578" stroke-width="1"/>
        <text x="140" y="334" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.12em">L1</text>
        <text x="176" y="338" fill="#191a2b" font-size="15" font-weight="600" font-family="'Oxanium', system-ui, sans-serif">SettingsDatabase</text>
        <text x="676" y="338" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="end">UPSERT + audit_log · agents table</text>

        <!-- band L0 -->
        <rect x="120" y="374" width="580" height="66" rx="0" fill="#ffffff" stroke="#4a5578" stroke-width="1"/>
        <text x="140" y="400" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.12em">L0</text>
        <text x="176" y="404" fill="#191a2b" font-size="15" font-weight="600" font-family="'Oxanium', system-ui, sans-serif">SQLite · WAL</text>
        <text x="676" y="404" fill="#4a5578" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="end">sovereign_settings.db</text>

        <!-- consumers -->
        <text x="740" y="150" fill="#5a6580" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.14em">CONSUMERS</text>
        <rect x="740" y="162" width="172" height="44" rx="6" fill="#f4f4f9"/>
        <rect x="740" y="162" width="172" height="44" rx="6" fill="rgba(60,52,137,0.05)" stroke="rgba(60,52,137,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="826" y="182" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">System Prompt</text>
        <text x="826" y="196" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">injected per chat → 02</text>

        <rect x="740" y="252" width="172" height="44" rx="6" fill="#f4f4f9"/>
        <rect x="740" y="252" width="172" height="44" rx="6" fill="rgba(25,26,43,0.03)" stroke="rgba(25,26,43,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="826" y="272" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Auth Middleware</text>
        <text x="826" y="286" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">bearer token → 09</text>

        <!-- notes -->
        <text x="120" y="472" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">On init, missing sections are inserted from FullSettings() defaults;</text>
        <text x="120" y="492" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">passwords and parental pins hash via bcrypt, cached in memory.</text>

        <!-- legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(25,26,43,0.10)" stroke-width="0.8"/>
        <rect x="40" y="548" width="16" height="10" rx="0" fill="rgba(60,52,137,0.06)" stroke="#3C3489" stroke-width="1"/>
        <text x="62" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">FOCAL · SERVICE</text>
        <rect x="176" y="548" width="16" height="10" rx="0" fill="#ffffff" stroke="#4a5578" stroke-width="1"/>
        <text x="198" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">LAYER BAND</text>
        <line x1="300" y1="553" x2="332" y2="553" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="338" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">ASSEMBLED PROMPT</text>
        <line x1="470" y1="553" x2="502" y2="553" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="508" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">SECURITY READ</text>
      </svg>
    </div>
  </div>
</body>
</html>
