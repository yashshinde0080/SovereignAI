[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==0.34.1",
    "aiofiles==23.2.1",
    "aiohttp==3.9.1",
    "aiosqlite==0.19.0",
    "cryptography==41.0.7",
    "faiss-cpu==1.7.4",
    "fastapi==0.109.0",
    "httpx>=0.28.1",
    "huggingface-hub==0.23.4",
    "numpy>=1.24.0,<2.0.0",
    "prompt-toolkit==3.0.43",
    "psutil==5.9.7",
    "pydantic>=2.0.0",
    "pydantic-settings==2.1.0",
    "pypdf==3.17.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-multipart==0.0.6",
    "rich==13.7.0",
    "safetensors>=0.7.0",
    "sentence-transformers>=2.2.0",
    "toml>=0.10.2",
    "torch==2.5.1",
    "tqdm==4.66.4",
    "transformers==4.45.2",
    "typer>=0.12.0",
    "uvicorn[standard]==0.27.0",
    "websockets==12.0",
]

[project.scripts]
sovereign = "app.cli.setup_cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
