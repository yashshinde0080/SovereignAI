<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Splitting &amp; Quantization — SovereignAI Edge</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxanium:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4f9;
      --color-ink:     #191a2b;
      --color-muted:   #4a5578;
      --color-accent:  #3C3489;
      --font-sans:  'Oxanium', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Source Code Pro', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · SovereignAI Edge</p>
    <h1>Weight Splitting &amp; Quantization</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-weight-splitting-title 06-weight-splitting-desc">
        <title id="06-weight-splitting-title">Full checkpoint split into per-layer quantized safetensors for LayerStream</title>
        <desc id="06-weight-splitting-desc">A model directory is loaded to CPU, its components detected as embed, layers, norm and lm_head, then quantized as none, int8 or int4 and written to the offload_cache directory as per-layer safetensors plus a quant_config.json.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5578"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3C3489"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#12704f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f4f9"/>

        <!-- connectors -->
        <line x1="188" y1="300" x2="213" y2="300" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="353" y1="300" x2="378" y2="300" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="518" y1="300" x2="543" y2="300" stroke="#4a5578" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="683" y1="300" x2="725" y2="300" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- input: model dir -->
        <rect x="48" y="268" width="140" height="64" rx="6" fill="#f4f4f9"/>
        <rect x="48" y="268" width="140" height="64" rx="6" fill="rgba(74,85,120,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="56" y="276" width="42" height="12" rx="2" fill="rgba(25,26,43,0.10)"/>
        <text x="77" y="285" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">INPUT</text>
        <text x="118" y="311" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Model dir</text>
        <text x="118" y="324" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">weights · config</text>

        <!-- step 1 load -->
        <rect x="213" y="268" width="140" height="64" rx="6" fill="#f4f4f9"/>
        <rect x="213" y="268" width="140" height="64" rx="6" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <rect x="221" y="276" width="26" height="12" rx="2" fill="rgba(25,26,43,0.10)"/>
        <text x="234" y="285" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">01</text>
        <text x="283" y="311" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Load → CPU</text>
        <text x="283" y="324" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">RAM ≥ 2× size</text>

        <!-- step 2 detect -->
        <rect x="378" y="268" width="140" height="64" rx="6" fill="#f4f4f9"/>
        <rect x="378" y="268" width="140" height="64" rx="6" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <rect x="386" y="276" width="26" height="12" rx="2" fill="rgba(25,26,43,0.10)"/>
        <text x="399" y="285" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">02</text>
        <text x="448" y="311" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Detect parts</text>
        <text x="448" y="324" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">embed·layer·norm</text>

        <!-- step 3 quantize (focal) -->
        <rect x="543" y="268" width="140" height="64" rx="6" fill="#f4f4f9"/>
        <rect x="543" y="268" width="140" height="64" rx="6" fill="rgba(60,52,137,0.08)" stroke="#3C3489" stroke-width="1.4"/>
        <rect x="551" y="276" width="26" height="12" rx="2" fill="rgba(60,52,137,0.18)"/>
        <text x="564" y="285" fill="#3C3489" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">03</text>
        <text x="613" y="310" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">Quantize</text>
        <text x="613" y="323" fill="#3C3489" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">none · int8 · int4</text>

        <!-- output: offload_cache store -->
        <rect x="725" y="234" width="187" height="132" rx="6" fill="#f4f4f9"/>
        <rect x="725" y="234" width="187" height="132" rx="6" fill="rgba(25,26,43,0.05)" stroke="#4a5578" stroke-width="1"/>
        <rect x="733" y="242" width="52" height="12" rx="2" fill="rgba(25,26,43,0.10)"/>
        <text x="759" y="251" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" text-anchor="middle">OUTPUT</text>
        <text x="818" y="270" fill="#191a2b" font-size="12" font-weight="600" font-family="'Oxanium', system-ui, sans-serif" text-anchor="middle">offload_cache/</text>
        <text x="737" y="291" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace">embed.safetensors</text>
        <text x="737" y="307" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace">layer_0 … layer_N</text>
        <text x="737" y="323" fill="#4a5578" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace">norm · lm_head</text>
        <text x="737" y="339" fill="#3C3489" font-size="8.5" font-family="'Source Code Pro', ui-monospace, monospace">quant_config.json</text>

        <!-- quant method detail row -->
        <text x="48" y="378" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace">int8  scale = max_abs / 127 · per-tensor symmetric</text>
        <text x="48" y="394" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace">int4  group=32 · scale = max_abs / 8 · pack 2 nibbles/byte</text>
        <text x="48" y="410" fill="#5a6580" font-size="9" font-family="'Source Code Pro', ui-monospace, monospace">&lt; 1024 elements stay fp — keeps RoPE math intact</text>

        <!-- callout -->
        <text x="590" y="404" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Split once, on first LayerStream</text>
        <text x="590" y="422" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">load — then delete the full</text>
        <text x="590" y="440" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">model from RAM.</text>

        <!-- legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(25,26,43,0.10)" stroke-width="0.8"/>
        <rect x="40" y="548" width="16" height="10" rx="2" fill="rgba(74,85,120,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="62" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">INPUT</text>
        <rect x="128" y="548" width="16" height="10" rx="2" fill="#ffffff" stroke="#191a2b" stroke-width="1"/>
        <text x="150" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">STEP</text>
        <rect x="210" y="548" width="16" height="10" rx="2" fill="rgba(60,52,137,0.08)" stroke="#3C3489" stroke-width="1"/>
        <text x="232" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">FOCAL · QUANTIZE</text>
        <rect x="368" y="548" width="16" height="10" rx="2" fill="rgba(25,26,43,0.05)" stroke="#4a5578" stroke-width="1"/>
        <text x="390" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">OUTPUT STORE</text>
        <line x1="500" y1="553" x2="532" y2="553" stroke="#3C3489" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="538" y="557" fill="#4a5578" font-size="8" font-family="'Source Code Pro', ui-monospace, monospace" letter-spacing="0.10em">WRITE PATH</text>
      </svg>
    </div>
  </div>
</body>
</html>
