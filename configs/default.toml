# SovereignAI Edge Configuration

[app]
name = "SovereignAI Edge"
version = "1.0.0"
debug = false

[server]
host = "127.0.0.1"
port = 8000

[paths]
models_dir = "./models"
workspace_dir = "./workspace"
plugins_dir = "./plugins"
database_path = "./database/sovereign.db"

[memory]
max_ram_usage_percent = 0.75
layer_prefetch_count = 2
kv_cache_max_mb = 2048

[security]
encryption_enabled = true
audit_logging = true

[model]
default_quant = "Q4_K_M"
default_mode = "auto"

[download]
huggingface_mirror = ""
max_concurrent_downloads = 1
verify_checksums = true

[plugins]
auto_load = true
sandbox_enabled = true
max_memory_mb = 512
max_time_seconds = 30