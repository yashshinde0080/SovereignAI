[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sovereign-engine"
version = "0.1.0"
description = "SovereignAI Python Inference Engine — local LLM inference with memory-mapped loading"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sovereign-engine = "engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
