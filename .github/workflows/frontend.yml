name: frontend

# Mirrors backend.yml for the Next.js app. Without this job the frontend's
# lint + unit tests + static export ran nowhere automatically.
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 23+ so `node --test` can run the .ts unit tests directly (built-in
          # type stripping). Next.js 16 itself needs >=20.9.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The static export is what Electron ships, so a broken build is a
      # release blocker, not just a frontend concern.
      - name: Build (static export)
        run: npm run build
